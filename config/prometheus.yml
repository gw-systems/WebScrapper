# Prometheus Configuration
# Scrapes metrics from the Node.js backend application

global:
  scrape_interval: 15s # Scrape targets every 15 seconds
  evaluation_interval: 15s # Evaluate rules every 15 seconds

scrape_configs:
  - job_name: 'webscraper-backend'
    static_configs:
      - targets: ['localhost:5000'] # Backend server
    metrics_path: '/metrics'
    scrape_interval: 10s # Scrape more frequently for testing
