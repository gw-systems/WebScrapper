version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: webscraper-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
      - ./database/seeds/dev_api_keys.sql:/docker-entrypoint-initdb.d/002_seeds.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U webscraper_user -d webscraper" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - webscraper-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: webscraper-backend
    init: true # Enable tini for zombie process reaping and signal forwarding
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      API_KEY_SECRET: ${API_KEY_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      MAX_BROWSERS_TOTAL: ${MAX_BROWSERS_TOTAL:-10}
      MAX_BROWSERS_PER_USER: ${MAX_BROWSERS_PER_USER:-2}
      SCRAPING_TIMEOUT_MS: ${SCRAPING_TIMEOUT_MS:-300000}
      SEARCH_TIMEOUT_MS: ${SEARCH_TIMEOUT_MS:-120000}
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      # Mount source code for hot reload in development
      - ./backend:/app
      - /app/node_modules
      - backend_logs:/app/logs
    command: npm run dev
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - webscraper-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: webscraper-frontend
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_WS_URL: ws://localhost:5000
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev
    networks:
      - webscraper-network

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: webscraper-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    depends_on:
      - backend
    networks:
      - webscraper-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: webscraper-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: ''
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana-dashboard.json:/var/lib/grafana/dashboards/webscraper.json
    depends_on:
      - prometheus
    networks:
      - webscraper-network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: webscraper-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - webscraper-network

volumes:
  postgres_data:
    driver: local
  backend_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  webscraper-network:
    driver: bridge
