services:
  postgres:
    image: postgres:14-alpine
    container_name: webscraper-postgres
    environment:
      POSTGRES_USER: webscraper_user
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: webscraper
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
      - ./database/seeds/dev_api_keys.sql:/docker-entrypoint-initdb.d/002_seeds.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U webscraper_user -d webscraper" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - webscraper-network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: webscraper-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@webscraper.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - webscraper-network

networks:
  webscraper-network:
    driver: bridge

volumes:
  postgres-data:
  pgadmin-data:
